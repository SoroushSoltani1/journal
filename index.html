<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayline</title>
<link rel="icon" href="data:,">
<style>
body { margin:0; padding:0; background:#1B1F2A; }
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

#dayline-root {
  --bg: #1B1F2A;
  --surface: #232A3B;
  --surface2: #2B3348;
  --text: #EDE6D6;
  --text-muted: #9C9484;
  --amber: #D9A441;
  --amber-soft: rgba(217,164,65,0.14);
  --rose: #C4685C;
  --rose-soft: rgba(196,104,92,0.14);
  --teal: #4E9C8F;
  --teal-soft: rgba(78,156,143,0.14);
  --border: rgba(237,230,214,0.12);
  --border-strong: rgba(237,230,214,0.22);
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
}
#dayline-root * { box-sizing: border-box; }
#dayline-root .serif { font-family: 'Fraunces', Georgia, serif; }
#dayline-root .mono { font-family: 'IBM Plex Mono', monospace; }

#dayline-root .loading-screen {
  min-height: 480px; display:flex; align-items:center; justify-content:center;
  color: var(--text-muted); font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:0.05em;
}

/* ---------- Onboarding ---------- */
#dayline-root .onboard-wrap {
  max-width: 560px; margin: 0 auto; padding: 56px 28px 40px;
}
#dayline-root .onboard-eyebrow {
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
  color: var(--amber); margin-bottom: 14px;
}
#dayline-root .onboard-title {
  font-size: 34px; font-weight: 600; line-height:1.15; margin-bottom: 10px;
}
#dayline-root .onboard-sub {
  color: var(--text-muted); font-size: 14.5px; line-height:1.6; margin-bottom: 36px; max-width: 460px;
}
#dayline-root .q-block { margin-bottom: 26px; }
#dayline-root .q-label {
  font-size: 13.5px; color: var(--text); margin-bottom: 8px; display:block; font-weight:500;
}
#dayline-root .q-hint { color: var(--text-muted); font-size: 12px; margin-bottom: 8px; }
#dayline-root textarea, #dayline-root input[type=text] {
  width: 100%; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); padding: 12px 14px; font-size: 14px;
  font-family: 'Inter', sans-serif; resize: vertical; outline: none; transition: border-color .15s;
}
#dayline-root textarea:focus, #dayline-root input[type=text]:focus { border-color: var(--amber); }
#dayline-root .btn {
  font-family:'IBM Plex Mono',monospace; font-size: 13px; letter-spacing:0.03em;
  background: var(--amber); color: #1B1F2A; border:none; padding: 12px 22px;
  border-radius: 7px; cursor:pointer; font-weight:600; transition: opacity .15s, transform .1s;
}
#dayline-root .btn:hover { opacity: 0.88; }
#dayline-root .btn:active { transform: scale(0.98); }
#dayline-root .btn:disabled { opacity:0.45; cursor:default; }
#dayline-root .btn-ghost {
  background: transparent; border: 1px solid var(--border-strong); color: var(--text);
}
#dayline-root .btn-ghost:hover { border-color: var(--amber); opacity:1; color: var(--amber); }

/* ---------- Shell / Nav ---------- */
#dayline-root .shell { display:flex; flex-direction:column; min-height: 560px; }
#dayline-root .topnav {
  display:flex; align-items:center; justify-content:space-between;
  padding: 18px 26px; border-bottom: 1px solid var(--border);
}
#dayline-root .brand { font-size: 18px; font-weight:600; display:flex; align-items:center; gap:8px; }
#dayline-root .brand-dot { width:8px; height:8px; border-radius:50%; background:var(--amber); }
#dayline-root .tabs { display:flex; gap: 4px; background: var(--surface); padding:4px; border-radius:9px; border:1px solid var(--border); }
#dayline-root .tab {
  font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.03em; padding: 7px 14px;
  border-radius:6px; cursor:pointer; color: var(--text-muted); transition: all .15s; user-select:none;
}
#dayline-root .tab.active { background: var(--amber); color:#1B1F2A; font-weight:600; }
#dayline-root .tab:not(.active):hover { color: var(--text); }
#dayline-root .content { flex:1; padding: 30px 26px 40px; }

/* ---------- Today view ---------- */
#dayline-root .today-date { color: var(--text-muted); font-family:'IBM Plex Mono',monospace; font-size:12.5px; margin-bottom:6px; letter-spacing:0.04em; }
#dayline-root .today-title { font-size: 26px; font-weight:600; margin-bottom: 20px; }
#dayline-root .today-card { background: var(--surface); border:1px solid var(--border); border-radius: 12px; padding: 22px; }

#dayline-root .result-card { display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; }
#dayline-root .dial-wrap { flex-shrink:0; position:relative; width:120px; height:120px; }
#dayline-root .dial-num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  flex-direction:column; }
#dayline-root .dial-score { font-family:'Fraunces',serif; font-size:32px; font-weight:600; line-height:1; }
#dayline-root .dial-of10 { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--text-muted); margin-top:2px; }
#dayline-root .result-body { flex:1; min-width:220px; }
#dayline-root .result-summary { font-size: 15.5px; line-height:1.55; margin-bottom: 12px; }
#dayline-root .result-insight { font-size: 13px; color: var(--text-muted); line-height:1.6; margin-bottom:14px; font-style:italic; }
#dayline-root .tag-row { display:flex; gap:7px; flex-wrap:wrap; }
#dayline-root .tag {
  font-family:'IBM Plex Mono',monospace; font-size: 11px; padding: 4px 10px; border-radius:20px;
  background: var(--amber-soft); color: var(--amber); border: 1px solid rgba(217,164,65,0.3);
}
#dayline-root .rewrite-link { margin-top:16px; font-size:12px; color:var(--text-muted); cursor:pointer; text-decoration:underline; }
#dayline-root .rewrite-link:hover { color: var(--amber); }

/* ---------- Timeline ---------- */
#dayline-root .timeline-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:14px; }
#dayline-root .zoom-toggle { display:flex; gap:4px; background:var(--surface); padding:4px; border-radius:8px; border:1px solid var(--border); }
#dayline-root .zoom-btn { font-family:'IBM Plex Mono',monospace; font-size:11.5px; padding:6px 12px; border-radius:5px; cursor:pointer; color:var(--text-muted); }
#dayline-root .zoom-btn.active { background: var(--teal); color:#0F1A18; font-weight:600; }
#dayline-root .year-nav { display:flex; align-items:center; gap:12px; font-family:'IBM Plex Mono',monospace; }
#dayline-root .year-nav button { background:none; border:1px solid var(--border-strong); color:var(--text); width:28px; height:28px; border-radius:6px; cursor:pointer; }
#dayline-root .year-nav button:hover { border-color: var(--amber); color:var(--amber); }
#dayline-root .year-label { font-size: 15px; font-weight:600; min-width:90px; text-align:center; }

#dayline-root .heat-row { display:flex; align-items:center; gap:10px; margin-bottom:5px; }
#dayline-root .heat-month-label { width:34px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-muted); flex-shrink:0; }
#dayline-root .heat-cells { display:flex; gap:3px; flex-wrap:wrap; }
#dayline-root .heat-cell { width:12px; height:12px; border-radius:3px; background: var(--surface2); border: 1px solid var(--border); cursor:pointer; }
#dayline-root .heat-cell:hover { outline: 2px solid var(--amber); outline-offset:1px; }
#dayline-root .heat-cell.has-entry { border-color: transparent; }
#dayline-root .heat-cell.is-future { visibility:hidden; cursor:default; }

#dayline-root .month-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap:6px; max-width: 480px; }
#dayline-root .month-day { aspect-ratio:1; border-radius:8px; background:var(--surface2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-muted); cursor:pointer; }
#dayline-root .month-day:hover { outline:2px solid var(--amber); outline-offset:2px; }
#dayline-root .month-day.has-entry { color:#1B1F2A; font-weight:600; border-color:transparent; }
#dayline-root .month-day.empty-cell { visibility:hidden; cursor:default; }
#dayline-root .month-day.is-future { cursor:default; opacity:0.35; }
#dayline-root .month-day.is-future:hover { outline:none; }
#dayline-root .weekday-label { text-align:center; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--text-muted); margin-bottom:2px;}

#dayline-root .legend { display:flex; align-items:center; gap:8px; margin-top:18px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-muted); }
#dayline-root .legend-swatch { width:11px; height:11px; border-radius:3px; }

#dayline-root .empty-state { color: var(--text-muted); font-size:13.5px; padding: 30px 0; text-align:center; }

/* ---------- Stats ---------- */
#dayline-root .stat-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap:14px; margin-bottom: 28px; }
#dayline-root .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; }
#dayline-root .stat-num { font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:var(--amber); }
#dayline-root .stat-label { font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-top:4px;}
#dayline-root .chart-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; }
#dayline-root .chart-title { font-size:13px; color:var(--text-muted); margin-bottom: 14px; font-family:'IBM Plex Mono',monospace; }

/* ---------- Modal ---------- */
#dayline-root .modal-overlay { position:absolute; inset:0; background:rgba(10,12,18,0.72); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; backdrop-filter: blur(2px); }
#dayline-root .modal-card { background:var(--surface); border:1px solid var(--border-strong); border-radius:14px; padding:26px; max-width:440px; width:100%; max-height:80vh; overflow-y:auto; }
#dayline-root .modal-close { float:right; cursor:pointer; color:var(--text-muted); font-family:'IBM Plex Mono',monospace; font-size:12px; }
#dayline-root .modal-close:hover { color: var(--amber); }
#dayline-root .modal-date { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-muted); margin-bottom:14px; }
#dayline-root .modal-text { font-size:14px; line-height:1.6; color: var(--text-muted); margin-top:16px; padding-top:16px; border-top:1px solid var(--border); white-space:pre-wrap; }

#dayline-root .error-box { background: var(--rose-soft); border:1px solid rgba(196,104,92,0.4); color:var(--rose); padding:12px 14px; border-radius:8px; font-size:13px; margin-top:14px; }

/* ---------- Profile ---------- */
#dayline-root .profile-card { background: var(--surface); border:1px solid var(--border); border-radius:12px; padding: 22px; margin-bottom: 24px; }
#dayline-root .save-confirm { color: var(--teal); font-size:12.5px; font-family:'IBM Plex Mono',monospace; margin-left:12px; }
#dayline-root .history-title { font-size:13px; color:var(--text-muted); margin-bottom:12px; font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:0.05em; }
#dayline-root .history-item { background: var(--surface); border:1px solid var(--border); border-radius:9px; margin-bottom:8px; overflow:hidden; }
#dayline-root .history-item summary { padding: 12px 16px; cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-muted); list-style:none; display:flex; align-items:center; justify-content:space-between; }
#dayline-root .history-item summary::-webkit-details-marker { display:none; }
#dayline-root .history-item summary:hover { color: var(--amber); }
#dayline-root .history-body { padding: 4px 16px 16px; font-size:13px; line-height:1.6; }
#dayline-root .history-label { color: var(--amber); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:0.04em; margin-top:10px; display:block; }
#dayline-root .history-val { color: var(--text-muted); margin-top:2px; margin-bottom:8px; }

/* ---------- Goals box ---------- */
#dayline-root .today-flex { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; }
#dayline-root .today-text-col { flex:1.6; min-width:260px; display:flex; flex-direction:column; gap:14px; }
#dayline-root .goals-box { flex:1; min-width:220px; background: var(--surface2); border:1px solid var(--border); border-radius:10px; padding:16px; }
#dayline-root .goals-box-title { font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-muted); margin-bottom:12px; }
#dayline-root .goal-item { display:flex; align-items:center; gap:9px; margin-bottom:9px; }
#dayline-root .goal-item input[type=checkbox] { width:16px; height:16px; accent-color: var(--teal); cursor:pointer; flex-shrink:0; }
#dayline-root .goal-item label { font-size:13px; flex:1; cursor:pointer; }
#dayline-root .goal-del { color: var(--text-muted); cursor:pointer; font-size:13px; flex-shrink:0; }
#dayline-root .goal-del:hover { color: var(--rose); }
#dayline-root .add-goal-row { display:flex; gap:6px; margin-top:10px; }
#dayline-root .add-goal-row input { flex:1; padding:8px 10px; font-size:12.5px; }
#dayline-root .add-goal-row button { padding:8px 12px; font-size:12px; }
#dayline-root .no-goals { color: var(--text-muted); font-size:12.5px; margin-bottom:8px; }
#dayline-root .self-rate-block { margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
#dayline-root .self-rate-label { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
#dayline-root .self-rate-val { font-family:'IBM Plex Mono',monospace; font-size:14px; color: var(--amber); font-weight:600; }
#dayline-root input[type=range] { width:100%; accent-color: var(--amber); cursor:pointer; }
#dayline-root .tick-row { display:flex; justify-content:space-between; margin-top:2px; font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--text-muted); padding:0 1px; }
#dayline-root .goal-item.excluded label:not(.goal-na-toggle) { opacity:0.4; text-decoration:line-through; }
#dayline-root .goal-na-toggle { display:flex; align-items:center; gap:4px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--text-muted); cursor:pointer; flex-shrink:0; }
#dayline-root .goal-na-toggle input { width:12px; height:12px; accent-color: var(--text-muted); cursor:pointer; }
#dayline-root .goal-chip.excluded { background: rgba(156,148,132,0.15); color: var(--text-muted); }

/* ---------- Coach chat ---------- */
#dayline-root .chat-card { background: var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; display:flex; flex-direction:column; }
#dayline-root .chat-scroll { max-height: 360px; min-height:140px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-right:4px; margin-bottom:12px; }
#dayline-root .chat-bubble { max-width:82%; padding:10px 13px; border-radius:12px; font-size:13.5px; line-height:1.5; white-space:pre-wrap; }
#dayline-root .chat-bubble.user { align-self:flex-end; background: var(--amber-soft); color: var(--text); border:1px solid rgba(217,164,65,0.25); border-bottom-right-radius:3px; }
#dayline-root .chat-bubble.assistant { align-self:flex-start; background: var(--surface2); border:1px solid var(--border); border-bottom-left-radius:3px; }
#dayline-root .chat-typing { color: var(--text-muted); font-style:italic; }
#dayline-root .chat-input-row { display:flex; gap:8px; align-items:flex-end; }
#dayline-root .chat-input-row textarea { flex:1; resize:none; }
#dayline-root .ai-profile-card { background: var(--teal-soft); border:1px solid rgba(78,156,143,0.35); border-radius:12px; padding:18px; margin-bottom:22px; }
#dayline-root .ai-profile-label { font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--teal); margin-bottom:8px; }
#dayline-root .ai-profile-text { font-size:13.5px; line-height:1.6; }
#dayline-root .ai-profile-date { font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-muted); margin-top:10px; }

#dayline-root .score-breakdown { font-family:'IBM Plex Mono',monospace; font-size:11px; color: var(--text-muted); margin-top:10px; }
#dayline-root .goal-recap { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
#dayline-root .goal-chip { font-family:'IBM Plex Mono',monospace; font-size:11px; padding:4px 9px; border-radius:6px; display:flex; align-items:center; gap:5px; }
#dayline-root .goal-chip.done { background: var(--teal-soft); color: var(--teal); }
#dayline-root .goal-chip.missed { background: var(--rose-soft); color: var(--rose); }

/* ---------- Goal stats ---------- */
#dayline-root .goal-stat-card { background: var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:12px; }
#dayline-root .goal-stat-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
#dayline-root .goal-stat-name { font-size:14px; font-weight:500; }
#dayline-root .goal-stat-pct { font-family:'IBM Plex Mono',monospace; font-size:13px; color: var(--amber); }
#dayline-root .goal-dots { display:flex; gap:3px; flex-wrap:wrap; }
#dayline-root .goal-dot { width:10px; height:10px; border-radius:50%; }

/* ---------- Goals tab ---------- */
#dayline-root .goal-formula-note { background: var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; font-size:12.5px; color:var(--text-muted); line-height:1.6; margin-bottom:22px; }
#dayline-root .goal-formula-note b { color: var(--amber); }
#dayline-root .add-goal-card { background: var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:22px; }
#dayline-root .goal-edit-card { background: var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; }
#dayline-root .goal-edit-row { display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; }
#dayline-root .goal-edit-fields { flex:1; min-width:200px; display:flex; flex-direction:column; gap:8px; }
#dayline-root .goal-edit-fields input[type=text] { font-size:14px; font-weight:500; }
#dayline-root .goal-edit-fields textarea { font-size:12.5px; }
#dayline-root .goal-edit-actions { display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
#dayline-root .goal-edit-actions .btn, #dayline-root .goal-edit-actions .btn-ghost { padding: 8px 14px; font-size:11.5px; }
#dayline-root .goal-saved-tag { color: var(--teal); font-family:'IBM Plex Mono',monospace; font-size:11px; margin-top:6px; }

@media (max-width: 480px) {
  #dayline-root .content { padding: 22px 16px 32px; }
  #dayline-root .today-title { font-size:21px; }
  #dayline-root .onboard-title { font-size: 26px; }
  #dayline-root .onboard-wrap { padding: 36px 18px 30px; }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<body>

<div id="dayline-root"><div id="dayline-app" class="loading-screen">loading dayline…</div></div>

<script>
(function(){
  
  const app = document.getElementById('dayline-app');

  let state = {
    view: 'loading',
    profile: null,
    profileHistory: [],
    goals: [],
    entries: {},
    timelineZoom: 'year',
    timelineYear: new Date().getFullYear(),
    timelineMonth: new Date().getMonth(),
    modalDate: null,
    modalEditing: false,
    loadingRate: false,
    errorMsg: null,
    editingToday: false,
    profileSaved: false,
    goalSaved: null,
    draft: null,
    chatMessages: [],
    chatLoading: false,
    chatError: null,
    aiProfile: null,
    aiProfileHistory: [],
    profileUpdatedFlag: false,
    aiProvider: null,
    apiKeys: { claude: '', gpt: '', gemini: '' },
    aiModel: { claude: 'claude-sonnet-5', gpt: 'gpt-4o', gemini: 'gemini-2.5-flash' },
    settingsSaved: false,
    supabaseUrl: '',
    supabaseAnonKey: '',
    session: null,
    syncStatus: 'idle',
    cloudSaved: false
  };

  const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const MONTH_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const WEEKDAYS = ['S','M','T','W','T','F','S'];

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function dateKey(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayKey(){ return dateKey(new Date()); }
  function prettyDate(key){
    const [y,m,d] = key.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  }
  function lerp(a, b, t){ return a + (b - a) * t; }
  function scoreColor(score){
    // Continuous gradient: rose (1) -> gold (5.5) -> teal (10), so 5.00 and 5.01 render as visibly distinct hues.
    const stops = [
      { at: 1,   c: [196, 104, 92]  },
      { at: 5.5, c: [217, 164, 65]  },
      { at: 10,  c: [78, 156, 143]  }
    ];
    const s = Math.max(1, Math.min(10, score));
    let lo = stops[0], hi = stops[stops.length - 1];
    for (let i = 0; i < stops.length - 1; i++) {
      if (s >= stops[i].at && s <= stops[i+1].at) { lo = stops[i]; hi = stops[i+1]; break; }
    }
    const t = (hi.at === lo.at) ? 0 : (s - lo.at) / (hi.at - lo.at);
    const r = Math.round(lerp(lo.c[0], hi.c[0], t));
    const g = Math.round(lerp(lo.c[1], hi.c[1], t));
    const b = Math.round(lerp(lo.c[2], hi.c[2], t));
    return `rgb(${r},${g},${b})`;
  }
  function scoreColorSoft(score){
    const c = scoreColor(score);
    return c.replace('rgb(', 'rgba(').replace(')', ',0.55)');
  }

  const LOCAL_STORAGE_KEY = 'dayline-data-v1';

  // Only journal content syncs to the cloud. API keys and model names stay local to this browser only,
  // even when signed in, so a provider key never sits in a shared database.
  function cloudDataPayload(){
    return {
      profile: state.profile, profileHistory: state.profileHistory, goals: state.goals, entries: state.entries,
      chatMessages: state.chatMessages, aiProfile: state.aiProfile, aiProfileHistory: state.aiProfileHistory
    };
  }

  async function saveData(){
    try {
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify({
        profile: state.profile, profileHistory: state.profileHistory, goals: state.goals, entries: state.entries,
        chatMessages: state.chatMessages, aiProfile: state.aiProfile, aiProfileHistory: state.aiProfileHistory,
        aiProvider: state.aiProvider, apiKeys: state.apiKeys, aiModel: state.aiModel,
        supabaseUrl: state.supabaseUrl, supabaseAnonKey: state.supabaseAnonKey
      }));
    } catch(e){ console.error('save failed', e); }
    if (state.session) await syncToCloud();
  }
  async function loadData(){
    try {
      const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        state.profile = d.profile || null;
        state.profileHistory = d.profileHistory || [];
        state.goals = d.goals || [];
        state.entries = d.entries || {};
        state.chatMessages = d.chatMessages || [];
        state.aiProfile = d.aiProfile || null;
        state.aiProfileHistory = d.aiProfileHistory || [];
        state.aiProvider = d.aiProvider || null;
        state.apiKeys = { claude: '', gpt: '', gemini: '', ...(d.apiKeys || {}) };
        state.aiModel = { claude: 'claude-sonnet-5', gpt: 'gpt-4o', gemini: 'gemini-2.5-flash', ...(d.aiModel || {}) };
        state.supabaseUrl = d.supabaseUrl || '';
        state.supabaseAnonKey = d.supabaseAnonKey || '';
      }
    } catch(e){ /* no data yet, or localStorage unavailable */ }
  }

  let sbClient = null;
  function getSupabaseClient(){
    if (!state.supabaseUrl || !state.supabaseAnonKey) return null;
    if (!sbClient) sbClient = window.supabase.createClient(state.supabaseUrl, state.supabaseAnonKey);
    return sbClient;
  }

  async function signInWithGoogle(){
    const client = getSupabaseClient();
    if (!client) { state.errorMsg = 'Add your Supabase project URL and key first, then save, before signing in.'; render(); return; }
    await client.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
  }

  async function signOutOfGoogle(){
    const client = getSupabaseClient();
    if (client) await client.auth.signOut();
    state.session = null;
    render();
  }

  // Runs once on login: pulls the person's saved cloud data down, or if this is their first time
  // signing in and they already had local entries, uploads what's on this device as the starting point.
  async function syncFromCloud(){
    const client = getSupabaseClient();
    if (!client || !state.session) return;
    state.syncStatus = 'syncing';
    try {
      const userId = state.session.user.id;
      const { data, error } = await client.from('dayline_data').select('data').eq('user_id', userId).maybeSingle();
      if (error) throw error;
      if (data && data.data) {
        const cloud = data.data;
        state.profile = cloud.profile || state.profile;
        state.profileHistory = cloud.profileHistory || state.profileHistory;
        state.goals = cloud.goals || state.goals;
        state.entries = cloud.entries || state.entries;
        state.chatMessages = cloud.chatMessages || state.chatMessages;
        state.aiProfile = cloud.aiProfile || state.aiProfile;
        state.aiProfileHistory = cloud.aiProfileHistory || state.aiProfileHistory;
      } else {
        // First login on this account, nothing in the cloud yet, upload whatever's local as the starting point.
        await syncToCloud();
      }
      state.syncStatus = 'synced';
    } catch(e) {
      console.error('cloud sync failed', e);
      state.syncStatus = 'error';
    }
  }

  async function syncToCloud(){
    const client = getSupabaseClient();
    if (!client || !state.session) return;
    try {
      await client.from('dayline_data').upsert({
        user_id: state.session.user.id,
        data: cloudDataPayload(),
        updated_at: new Date().toISOString()
      });
      state.syncStatus = 'synced';
    } catch(e) {
      console.error('cloud sync failed', e);
      state.syncStatus = 'error';
    }
  }

  // Calls whichever provider the person has connected, directly from the browser with their own key.
  // No server involved: Anthropic requires the anthropic-dangerous-direct-browser-access header for this,
  // OpenAI allows direct browser calls with just the normal Authorization header.
  async function callAI({ system, messages, maxTokens }){
    const provider = state.aiProvider;
    const key = provider ? state.apiKeys[provider] : null;
    if (!provider || !key) { const e = new Error('NO_KEY'); throw e; }

    if (provider === 'claude') {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({ model: state.aiModel.claude, max_tokens: maxTokens || 1000, system, messages })
      });
      if (!res.ok) { const e = new Error('API_ERROR'); throw e; }
      const data = await res.json();
      return (data.content || []).map(b => b.text || '').join('').trim();
    }

    if (provider === 'gpt') {
      const res = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({
          model: state.aiModel.gpt,
          max_tokens: maxTokens || 1000,
          messages: [{ role: 'system', content: system }, ...messages]
        })
      });
      if (!res.ok) { const e = new Error('API_ERROR'); throw e; }
      const data = await res.json();
      return (data.choices && data.choices[0] && data.choices[0].message) ? data.choices[0].message.content.trim() : '';
    }

    if (provider === 'gemini') {
      // Gemini's REST API takes the key as a URL param and uses "model" (not "assistant") as the AI role name.
      const contents = messages.map(m => ({
        role: m.role === 'assistant' ? 'model' : 'user',
        parts: [{ text: m.content }]
      }));
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${state.aiModel.gemini}:generateContent?key=${encodeURIComponent(key)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents,
          systemInstruction: { parts: [{ text: system }] },
          generationConfig: { maxOutputTokens: maxTokens || 1000 }
        })
      });
      if (!res.ok) { const e = new Error('API_ERROR'); throw e; }
      const data = await res.json();
      const cand = data.candidates && data.candidates[0];
      return (cand && cand.content && cand.content.parts) ? cand.content.parts.map(p => p.text || '').join('').trim() : '';
    }

    const e = new Error('NO_KEY'); throw e;
  }

  async function rateDay(text, goalContext){
    const p = state.profile;
    const aiProfileNote = state.aiProfile && state.aiProfile.summary
      ? `\nAdditional context the AI has picked up from past coaching chats with this user: ${state.aiProfile.summary}`
      : '';
    const system = `You are a warm, perceptive journaling companion. The user just described their day. Respond with ONLY strict JSON, no markdown fences, no commentary, in exactly this shape:
{"score": <number between 1.00 and 10.00, exactly two decimal places, e.g. 7.35>, "summary": "<one warm, specific sentence under 25 words describing the day>", "tags": ["<up to 4 short lowercase tags>"], "insight": "<one supportive sentence under 30 words connecting the day to the user's stated goals/values, never harsh even if the score is low>"}

Score the day relative to THIS person's own stated goals and values below, not a generic productivity standard. Be kind, specific, and never judgmental, even a hard day deserves a thoughtful, non-punishing reflection. Do not default to a neutral 5.00 for uneventful days: a day where little happened, the user was mostly idle, or nothing moved them toward their goals/values should generally land closer to 3.00, since it genuinely did little for them, not because it was bad. Reserve scores near 5 for days with real mixed results (some wins, some setbacks), and use the full 1 to 10 range based on what actually happened. This is the user's private journal, so their entry may be raw, unfiltered, or emotionally intense; just reflect on it honestly and kindly, the same way you would any other day.

User's goals: ${p.goals || 'not specified'}
User's values / what matters day-to-day: ${p.values || 'not specified'}
User's redlines / things they want to avoid: ${p.redlines || 'not specified'}${aiProfileNote}
${goalContext ? `\nThe user also tracks these daily goals. Use this as extra context for your summary and insight, but you are only scoring the written entry itself, a separate fixed formula (not you) already accounts for goal completion in the final score:\n${goalContext}` : ''}`;

    let raw;
    try {
      raw = await callAI({ system, messages: [{ role: "user", content: text }], maxTokens: 1000 });
    } catch(e) {
      if (e.message === 'NO_KEY') throw e; // let the caller prompt the person to connect a provider
      return { skipped: true }; // network/API failure, fall back gracefully
    }
    const clean = raw.replace(/```json|```/g, '').trim();
    try {
      const parsed = JSON.parse(clean);
      if (typeof parsed.score !== 'number') return { skipped: true };
      return parsed;
    } catch (e) {
      // The model didn't return scoreable JSON (declined, filtered, or otherwise unable to rate this entry).
      // Treat this as "AI unavailable for this entry" rather than a hard error, so the day can still be
      // rated from goals and the person's own number.
      return { skipped: true };
    }
  }

  function dayFormHTML(dateKey, entry, context){
    const draft = (state.draft && state.draft.dateKey === dateKey) ? state.draft : null;
    const textVal = draft ? draft.text : (entry ? entry.text : '');
    const userScoreVal = draft ? draft.userScore : (entry && entry.userScore != null ? entry.userScore : 5);
    const checkedIds = draft ? draft.goalChecks : (entry && entry.goalSnapshot ? entry.goalSnapshot.filter(g=>g.done).map(g=>g.id) : []);
    const excludedIds = draft ? draft.goalExcludes : (entry && entry.goalSnapshot ? entry.goalSnapshot.filter(g=>g.excluded).map(g=>g.id) : []);
    return `

        <div class="today-text-col">

  function renderResultCard(entry, withEditLink, dateKey){
    const c = scoreColor(entry.score);
    const circumference = 2 * Math.PI * 50;
    const dash = (entry.score/10) * circumference;
    const hasBreakdown = entry.aiScore != null && entry.userScore != null;
    return `
      <div class="result-card">
        <div class="dial-wrap">
          <svg width="120" height="120" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(237,230,214,0.1)" stroke-width="9"/>
            <circle cx="60" cy="60" r="50" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round"
              stroke-dasharray="${dash} ${circumference}" transform="rotate(-90 60 60)"/>
          </svg>
          <div class="dial-num">
            <div class="dial-score serif" style="color:${c}">${Number(entry.score).toFixed(2)}</div>
            <div class="dial-of10">OUT OF 10</div>
          </div>
        </div>
        <div class="result-body">
          <div class="result-summary">${escapeHtml(entry.summary)}</div>
          ${entry.insight ? `<div class="result-insight">"${escapeHtml(entry.insight)}"</div>` : ''}
          <div class="tag-row">${(entry.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
          ${hasBreakdown ? `<div class="score-breakdown">AI ${Number(entry.aiScore).toFixed(2)} · You ${Number(entry.userScore).toFixed(2)} · Goals ${entry.goalAdjustment >= 0 ? '+' : ''}${Number(entry.goalAdjustment).toFixed(2)}</div>` : ''}
          ${entry.goalSnapshot && entry.goalSnapshot.length > 0 ? `
            <div class="goal-recap">
              ${entry.goalSnapshot.map(g => `<span class="goal-chip ${g.excluded ? 'excluded' : (g.done?'done':'missed')}">${g.excluded ? '~' : (g.done?'✓':'✕')} ${escapeHtml(g.text)}</span>`).join('')}
            </div>
          ` : ''}
          ${withEditLink ? `<div class="rewrite-link" id="rewrite-link" data-datekey="${dateKey}">rewrite this entry</div>` : ''}
        </div>
      </div>
      ${entry.versions && entry.versions.length > 0 ? versionsHTML(entry.versions) : ''}
    `;
  }

  function versionsHTML(versions){
    return `
      <div class="history-title" style="margin-top:20px;">Past versions of this entry (${versions.length})</div>
      ${versions.map(v => `
        <details class="history-item">
          <summary><span>${new Date(v.ts).toLocaleString(undefined,{month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}</span><span>view →</span></summary>
          <div class="history-body">
            <div class="score-breakdown" style="margin-top:0; margin-bottom:8px;">Score ${Number(v.score).toFixed(2)} ${v.aiScore != null ? `· AI ${Number(v.aiScore).toFixed(2)} · You ${Number(v.userScore).toFixed(2)}` : ''}</div>
            <div>${escapeHtml(v.summary || '')}</div>
            <div class="modal-text">${escapeHtml(v.text)}</div>
          </div>
        </details>
      `).join('')}
    `;
  }

  async function submitDayEditor(dateKey, context){
    const textEl = document.getElementById('editor-text');
    const text = textEl.value.trim();
    if (!text) { state.errorMsg = 'Write a little about this day first.'; render(); return; }

    const goalSnapshot = state.goals.map(g => {
      const excluded = !!document.getElementById(`editor-exclude-${g.id}`).checked;
      return {
        id: g.id,
        text: g.text,
        description: g.description || '',
        excluded,
        done: excluded ? false : !!document.getElementById(`editor-goal-${g.id}`).checked
      };
    });
    const userScore = parseFloat(document.getElementById('editor-self-rate-slider').value);

    // Preserve the in-progress draft across the loading re-render so nothing typed gets lost.
    state.draft = {
      dateKey, text, userScore,
      goalChecks: goalSnapshot.filter(g => g.done).map(g => g.id),
      goalExcludes: goalSnapshot.filter(g => g.excluded).map(g => g.id)
    };
    state.loadingRate = true;
    state.errorMsg = null;
    render();

    // Standardized formula: total possible swing is fixed (MAX_GOAL_SWING), split evenly across
    // whichever goals are active (not excluded) that day, so more goals = smaller effect each,
    // and excluding a goal for the day removes it from the pot entirely rather than counting as a miss.
    const MAX_GOAL_SWING = 2.0;
    const activeGoals = goalSnapshot.filter(g => !g.excluded);
    const doneCount = activeGoals.filter(g => g.done).length;
    const missedCount = activeGoals.length - doneCount;
    const perGoalWeight = activeGoals.length > 0 ? (MAX_GOAL_SWING / activeGoals.length) : 0;
    const goalAdjustment = (doneCount - missedCount) * perGoalWeight;

    try {
      const goalContext = goalSnapshot.length > 0
        ? goalSnapshot.map(g => `- ${g.text}${g.description ? ' (' + g.description + ')' : ''}: ${g.excluded ? "doesn't apply today" : (g.done ? 'done' : 'not done')} that day`).join('\n')
        : '';
      const result = await rateDay(text, goalContext);

      let newCore;
      if (result.skipped) {
        // AI couldn't or wouldn't score this entry; fall back to goals + the person's own rating only.
        const finalScore = Math.max(0, Math.min(10, userScore + goalAdjustment));
        newCore = {
          text, summary: "Not scored by AI, today's number comes from your own rating and goal completion only.",
          tags: [], insight: null, aiScore: null, userScore, goalAdjustment, goalSnapshot,
          score: finalScore, ts: Date.now()
        };
      } else {
        const aiScore = result.score;
        const adjustedAI = Math.max(0, Math.min(10, aiScore + goalAdjustment));
        const finalScore = Math.max(0, Math.min(10, (adjustedAI + userScore) / 2));
        newCore = {
          text, summary: result.summary, tags: result.tags, insight: result.insight,
          aiScore, userScore, goalAdjustment, goalSnapshot, score: finalScore, ts: Date.now()
        };
      }

      const existing = state.entries[dateKey];
      let versions = existing ? (existing.versions || []) : [];
      if (existing) {
        const { versions: _old, ...prevCore } = existing;
        versions = [prevCore, ...versions];
      }
      state.entries[dateKey] = { ...newCore, versions };

      if (context === 'today') state.editingToday = false;
      else state.modalEditing = false;
      state.draft = null;
      await saveData();
    } catch(e) {
      state.errorMsg = (e.message === 'NO_KEY')
        ? "Connect a Claude or GPT API key in the Profile tab first, that's how ratings get generated."
        : "Couldn't rate this day. Try again in a moment.";
    }
    state.loadingRate = false;
    render();
  }

  async function sendChatMessage(){
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    state.chatMessages.push({ role: 'user', content: text, ts: Date.now() });
    state.chatLoading = true;
    state.chatError = null;
    render();
    scrollChatToBottom();
    try {
      const p = state.profile || {};
      const system = `You are Dayline's coach, a warm, curious companion who helps this person reflect on how their journaling is going, what's working, and what daily goals might be worth adding or dropping. Keep replies conversational and fairly short (2 to 5 sentences), ask a follow up question when it's natural, and don't lecture. You can see their stated goals/values/redlines for context: goals: ${p.goals || 'not specified'}; values: ${p.values || 'not specified'}; redlines: ${p.redlines || 'not specified'}.`;
      const apiMessages = state.chatMessages.map(m => ({ role: m.role, content: m.content }));
      const reply = (await callAI({ system, messages: apiMessages, maxTokens: 800 })) || "I couldn't quite form a reply there, try again?";
      state.chatMessages.push({ role: 'assistant', content: reply, ts: Date.now() });
      await saveData();
    } catch(e) {
      state.chatError = (e.message === 'NO_KEY')
        ? "Connect a Claude or GPT API key in the Profile tab first."
        : "Couldn't reach the coach just now, try again in a moment.";
    }
    state.chatLoading = false;
    render();
    scrollChatToBottom();
  }

  function scrollChatToBottom(){
    setTimeout(() => {
      const el = document.getElementById('chat-scroll');
      if (el) el.scrollTop = el.scrollHeight;
    }, 30);
  }

  async function updateAIProfile(){
    if (state.chatMessages.length === 0) return;
    state.chatLoading = true;
    state.chatError = null;
    render();
    try {
      const transcript = state.chatMessages.map(m => `${m.role === 'user' ? 'User' : 'Coach'}: ${m.content}`).join('\n');
      const system = `Read this coaching conversation between a journaling app and its user. Respond with ONLY strict JSON, no markdown fences: {"summary": "<2 to 4 sentences, written in third person, summarizing what you've learned about this person's goals, patterns, motivations, or what they seem to want from their journaling, to be used as background context for future day-ratings">}. Be specific and grounded in what was actually said, not generic.`;
      const raw = await callAI({ system, messages: [{ role: "user", content: transcript }], maxTokens: 500 });
      const clean = raw.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);
      if (state.aiProfile) {
        state.aiProfileHistory = state.aiProfileHistory || [];
        state.aiProfileHistory.unshift(state.aiProfile);
      }
      state.aiProfile = { summary: parsed.summary, ts: Date.now() };
      state.profileUpdatedFlag = true;
      await saveData();
      setTimeout(() => { state.profileUpdatedFlag = false; }, 3000);
    } catch(e) {
      state.chatError = (e.message === 'NO_KEY')
        ? "Connect a Claude or GPT API key in the Profile tab first."
        : "Couldn't update your profile from this chat, try again in a moment.";
    }
    state.chatLoading = false;
    render();
  }

    // Unified day editor wiring (used by both Today and the Timeline modal)

        goal.description = document.getElementById(`edit-desc-${id}`).value.trim();
        await saveData();
        state.goalSaved = id;
        render();
        setTimeout(() => { state.goalSaved = null; }, 2000);
      });

    // Timeline wiring

      state.timelineZoom = el.dataset.zoom;

        if (new Date(y, m-1, d) > new Date()) return; // no rating future days

    const settingsSaveBtn = document.getElementById('settings-save');

        state.aiProvider = settings.aiProvider;
        state.apiKeys = settings.apiKeys;
        state.aiModel = settings.aiModel;
        state.settingsSaved = true;
        await saveData();
        render();
        setTimeout(() => { state.settingsSaved = false; }, 2500);

    const profileSaveBtn = document.getElementById('profile-save');
    if (profileSaveBtn) {
      profileSaveBtn.addEventListener('click', async () => {
        const goals = document.getElementById('p-goals').value.trim();
        const values = document.getElementById('p-values').value.trim();
        const redlines = document.getElementById('p-redlines').value.trim();
        if (state.profile) {
          state.profileHistory = state.profileHistory || [];
          state.profileHistory.unshift({ ...state.profile, ts: Date.now() });
        }
        state.profile = { goals, values, redlines };
        state.profileSaved = true;
        await saveData();
        render();
        setTimeout(() => { state.profileSaved = false; }, 2500);
      });

    // Coach chat wiring

    if (updateProfileBtn) updateProfileBtn.addEventListener('click', updateAIProfile);

    const modalClose = document.getElementById('modal-close-btn');
    if (modalClose) modalClose.addEventListener('click', () => { state.modalDate = null; state.modalEditing = false; state.draft = null; render(); });
    const overlay = document.querySelector('.modal-overlay');
    if (overlay) overlay.addEventListener('click', (e) => { if (e.target === overlay) { state.modalDate = null; state.modalEditing = false; state.draft = null; render(); } });

      if (state.timelineMonth > 11) { state.timelineMonth = 0; state.timelineYear++; }

  function yearHeatmapHTML(){
    const y = state.timelineYear;
    let rows = '';
    for (let m = 0; m < 12; m++) {
      const daysInMonth = new Date(y, m+1, 0).getDate();
      let cells = '';
      for (let d = 1; d <= daysInMonth; d++) {
        const key = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const entry = state.entries[key];
        const isFuture = new Date(y,m,d) > new Date();
        const style = entry ? `background:${scoreColor(entry.score)};` : '';
        cells += `<div class="heat-cell ${entry?'has-entry':''} ${isFuture && !entry ? 'is-future':''}" style="${style}" data-daykey="${key}" title="${entry ? key+' - '+Number(entry.score).toFixed(2)+'/10' : key}"></div>`;
      }
      rows += `<div class="heat-row"><div class="heat-month-label mono">${MONTH_NAMES[m]}</div><div class="heat-cells">${cells}</div></div>`;
    }
    return `<div>${rows}</div>`;
  }

  function monthGridHTML(){
    const y = state.timelineYear, m = state.timelineMonth;
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const firstWeekday = new Date(y, m, 1).getDay();
    let cells = '';
    for (let i = 0; i < firstWeekday; i++) cells += `<div class="month-day empty-cell"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const key = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const entry = state.entries[key];
      const isFuture = new Date(y,m,d) > new Date();
      const style = entry ? `background:${scoreColor(entry.score)};` : '';
      cells += `<div class="month-day ${entry?'has-entry':''} ${isFuture?'is-future':''}" style="${style}" data-daykey="${key}">${d}</div>`;

  function statsHTML(){
    const entries = Object.entries(state.entries).sort((a,b) => a[0] < b[0] ? -1 : 1);
    if (entries.length === 0) {
      return `<div class="empty-state">Rate a few days and your stats will show up here.</div>${usagePanelHTML()}`;
    }
    const scores = entries.map(([,e]) => e.score);
    const avg = (scores.reduce((a,b)=>a+b,0) / scores.length).toFixed(2);
    const best = entries.reduce((a,b) => b[1].score > a[1].score ? b : a);
    let streak = 0;
    let cursor = new Date();
    while (true) {
      const k = dateKey(cursor);
      if (state.entries[k]) { streak++; cursor.setDate(cursor.getDate()-1); }
      else break;
    }

    return `
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-num serif">${avg}</div><div class="stat-label">avg score</div></div>
        <div class="stat-card"><div class="stat-num serif">${entries.length}</div><div class="stat-label">days logged</div></div>
        <div class="stat-card"><div class="stat-num serif">${streak}</div><div class="stat-label">day streak</div></div>
        <div class="stat-card"><div class="stat-num serif" style="color:${scoreColor(best[1].score)}">${Number(best[1].score).toFixed(2)}</div><div class="stat-label">best day</div></div>
      </div>

        ${lineChartSVG(entries)}
      </div>
      ${usagePanelHTML()}
      ${goalStatsHTML(entries)}

  function rollingCompletionPct(dots, window){
    return dots.map((_, i) => {
      const start = Math.max(0, i - window + 1);
      const slice = dots.slice(start, i + 1);
      return (slice.filter(Boolean).length / slice.length) * 100;
    });
  }

  let chartIdCounter = 0;
  function miniLineSVG(values, color, w, h){
    w = w || 560; h = h || 76;
    const pad = 10;
    const n = values.length;
    if (n === 0) return '';
    const gid = 'chartFill' + (chartIdCounter++);
    const points = values.map((v, i) => {
      const x = n === 1 ? w/2 : pad + (i/(n-1)) * (w - pad*2);
      const y = h - pad - (v/100) * (h - pad*2);
      return { x, y };
    });
    const lineD = points.map((p,i) => (i===0?'M':'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
    const areaD = `${lineD} L${points[points.length-1].x.toFixed(1)},${h-pad} L${points[0].x.toFixed(1)},${h-pad} Z`;
    const gridLines = [0, 50, 100].map(v => {
      const y = h - pad - (v/100) * (h - pad*2);
      return `<line x1="${pad}" y1="${y.toFixed(1)}" x2="${w-pad}" y2="${y.toFixed(1)}" stroke="rgba(237,230,214,0.07)" stroke-width="1"/>`;
    }).join('');
    const last = points[points.length - 1];
    const lastVal = values[values.length - 1];
    return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${gridLines}
      <path d="${areaD}" fill="url(#${gid})" stroke="none"/>
      <path d="${lineD}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="3.5" fill="${color}"/>
      <text x="${Math.min(w-pad-2, last.x+6).toFixed(1)}" y="${(last.y-6).toFixed(1)}" font-size="10" fill="${color}" font-family="IBM Plex Mono, monospace" text-anchor="${last.x > w-40 ? 'end' : 'start'}">${Math.round(lastVal)}%</text>
    </svg>`;
  }

  function goalStatsHTML(entries){
    // Aggregate goal completion across entries by goal id, regardless of whether the goal still exists live
    const goalMap = {};
    entries.forEach(([, e]) => {
      (e.goalSnapshot || []).forEach(g => {
        if (g.excluded) return;
        if (!goalMap[g.id]) goalMap[g.id] = { text: g.text, dots: [] };
        goalMap[g.id].text = g.text;
        goalMap[g.id].dots.push(g.done);
      });
    });
    const ids = Object.keys(goalMap);
    if (ids.length === 0) return '';

    const combinedSeries = entries
      .map(([, e]) => (e.goalSnapshot || []).filter(g => !g.excluded))
      .filter(active => active.length > 0)
      .map(active => (active.filter(g => g.done).length / active.length) * 100);

    return `
      <div class="chart-title" style="margin-top:26px; margin-bottom:12px;">goals over time</div>
      ${ids.map(id => {
        const g = goalMap[id];
        const total = g.dots.length;
        const done = g.dots.filter(Boolean).length;
        const pct = total ? Math.round((done/total)*100) : 0;
        const dots = g.dots.map(d => `<span class="goal-dot" style="background:${d ? '#4E9C8F' : '#C4685C'}"></span>`).join('');
        const rolling = rollingCompletionPct(g.dots, 5);
        return `
          <div class="goal-stat-card">
            <div class="goal-stat-head">
              <span class="goal-stat-name">${escapeHtml(g.text)}</span>
              <span class="goal-stat-pct">${pct}% · ${done}/${total}</span>
            </div>
            ${total > 1 ? miniLineSVG(rolling, '#D9A441') : ''}
            <div class="goal-dots">${dots}</div>
          </div>
        `;
      }).join('')}
      ${combinedSeries.length > 1 ? `
        <div class="chart-card" style="margin-top:6px;">
          <div class="chart-title">all goals combined, % completed per day</div>
          ${miniLineSVG(combinedSeries, '#4E9C8F', 640, 140)}
        </div>
      ` : ''}
    `;
  }

  function lineChartSVG(entries){
    const w = 640, h = 180, pad = 24;
    const n = entries.length;
    const points = entries.map(([key, e], i) => {
      const x = n === 1 ? w/2 : pad + (i/(n-1)) * (w - pad*2);
      const y = h - pad - ((e.score-1)/9) * (h - pad*2);
      return { x, y, score: e.score, key };
    });
    const pathD = points.map((p,i) => (i===0?'M':'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
    const dots = points.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${scoreColor(p.score)}" stroke="#232A3B" stroke-width="2"/>`).join('');
    const gridLines = [1,4,7,10].map(v => {
      const y = h - pad - ((v-1)/9) * (h - pad*2);
      return `<line x1="${pad}" y1="${y.toFixed(1)}" x2="${w-pad}" y2="${y.toFixed(1)}" stroke="rgba(237,230,214,0.08)" stroke-width="1"/>
              <text x="4" y="${(y+3).toFixed(1)}" font-size="10" fill="#9C9484" font-family="IBM Plex Mono, monospace">${v}</text>`;
    }).join('');
    return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
      ${gridLines}
      <path d="${pathD}" fill="none" stroke="#D9A441" stroke-width="2"/>
      ${dots}
    </svg>`;
  }

  function goalsTabHTML(){
    const n = state.goals.length;
    const perGoal = n > 0 ? (2.0 / n).toFixed(2) : '0.00';
    return `
      <div class="today-title serif" style="margin-bottom:6px;">Daily goals</div>
      <div class="q-hint" style="margin-bottom:16px;">Things you're trying to do every day - "read 10 pages," "pray," "no doom scrolling." Check these off when you rate each day. Each goal is currently worth <b style="color:var(--amber);">±${perGoal}</b> toward your final score, see the math explainer at the bottom for how that works.</div>

      <div class="add-goal-card">
        <div class="q-block" style="margin-bottom:10px;">
          <label class="q-label">New goal</label>
          <input type="text" id="new-goal-input" placeholder="e.g. read 10 pages">
        </div>
        <div class="q-block" style="margin-bottom:12px;">
          <label class="q-label">Context for the AI (optional)</label>
          <textarea id="new-goal-desc" rows="2" placeholder="Anything that helps it understand this goal: why it matters, what counts as done, etc."></textarea>
        </div>
        <button class="btn" id="add-goal-btn">Add goal</button>
      </div>

      ${n === 0 ? `<div class="empty-state">No daily goals yet. Add your first one above.</div>` : state.goals.map(g => `
        <div class="goal-edit-card">
          <div class="goal-edit-row">
            <div class="goal-edit-fields">
              <input type="text" id="edit-text-${g.id}" value="${escapeHtml(g.text)}">
              <textarea id="edit-desc-${g.id}" rows="2" placeholder="context for the AI (optional)">${escapeHtml(g.description || '')}</textarea>
              ${state.goalSaved === g.id ? `<span class="goal-saved-tag">saved ✓</span>` : ''}
            </div>
            <div class="goal-edit-actions">
              <button class="btn" data-savegoal="${g.id}">Save</button>
              <button class="btn btn-ghost" data-delgoal="${g.id}">Delete</button>
            </div>
          </div>
        </div>
      `).join('')}

      <details class="history-item" style="margin-top:22px;">
        <summary><span>How the goal math affects your score</span><span>view →</span></summary>
        <div class="history-body">
          <p style="margin-bottom:10px;">Your final score each day blends two things: the AI's read of what you wrote, adjusted by your goals, and your own self-rating.</p>
          <p style="margin-bottom:10px;"><b>Step 1.</b> The AI scores your entry on its own, 1.00 to 10.00, based on your stated values and goals.</p>
          <p style="margin-bottom:10px;"><b>Step 2.</b> Goal adjustment: there's a fixed total swing of <b>±2.00</b> available from goals, no matter how many you have. That pot is split evenly, so each goal is worth <b>±${perGoal}</b> right now. Every goal you complete adds its share, every goal you miss subtracts its share. More goals means each one matters a little less individually, but the total possible pull on your score stays the same.</p>
          <p style="margin-bottom:10px;"><b>Step 3.</b> That adjusted AI score is averaged with your own self-rating, straight 50/50, to produce the final number.</p>
          <p style="margin:0;">So: <span class="mono">final = (clamp(AI score + goal adjustment) + your rating) / 2</span></p>
        </div>
      </details>
    `;
  }

  function buildExportText(){
    const lines = [];
    lines.push('DAYLINE EXPORT');
    lines.push('Generated ' + new Date().toLocaleString());
    lines.push('');
    lines.push('=== PROFILE ===');
    if (state.profile) {
      lines.push('Goals: ' + (state.profile.goals || ''));
      lines.push('Values: ' + (state.profile.values || ''));
      lines.push('Redlines: ' + (state.profile.redlines || ''));
    }
    if (state.aiProfile) {
      lines.push('');
      lines.push('AI-derived insight (from Coach chats): ' + state.aiProfile.summary);
    }
    lines.push('');
    lines.push('=== DAILY GOALS ===');
    if (state.goals.length === 0) lines.push('(none)');
    state.goals.forEach(g => lines.push('- ' + g.text + (g.description ? ' (' + g.description + ')' : '')));
    lines.push('');
    lines.push('=== ENTRIES ===');
    const keys = Object.keys(state.entries).sort();
    if (keys.length === 0) lines.push('(none)');
    keys.forEach(k => {
      const e = state.entries[k];
      lines.push('');
      lines.push('--- ' + k + ' ---');
      lines.push('Score: ' + Number(e.score).toFixed(2) + '/10');
      if (e.aiScore != null) lines.push('  AI score: ' + Number(e.aiScore).toFixed(2) + ' | Your rating: ' + Number(e.userScore).toFixed(2) + ' | Goal adjustment: ' + (e.goalAdjustment>=0?'+':'') + Number(e.goalAdjustment).toFixed(2));
      else lines.push('  (not AI-scored, based on your rating and goals only)');
      if (e.summary) lines.push('Summary: ' + e.summary);
      if (e.insight) lines.push('Insight: ' + e.insight);
      if (e.tags && e.tags.length) lines.push('Tags: ' + e.tags.join(', '));
      if (e.goalSnapshot && e.goalSnapshot.length) {
        lines.push('Goals that day:');
        e.goalSnapshot.forEach(g => lines.push('  ' + (g.excluded ? '[N/A]' : (g.done ? '[x]' : '[ ]')) + ' ' + g.text));
      }
      lines.push('Entry:');
      lines.push(e.text);
      if (e.versions && e.versions.length) lines.push('(' + e.versions.length + ' earlier version' + (e.versions.length>1?'s':'') + ' of this entry not shown, exported from the current version only)');
    });
    return lines.join('\n');
  }

  function exportData(){
    const text = buildExportText();
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'dayline-export-' + todayKey() + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function profileHTML(){
    const p = state.profile || { goals:'', values:'', redlines:'' };
    const history = state.profileHistory || [];
    const aiHistory = state.aiProfileHistory || [];
    return `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
        <div class="q-hint" style="margin:0;">Your data lives in this browser's storage. Export it anytime to keep a copy or take it elsewhere.</div>
        <button class="btn btn-ghost" id="export-btn">Export all my data (.txt)</button>
      </div>

      <div class="today-title serif" style="margin-bottom:6px; font-size:19px;">Account</div>
      <div class="profile-card">
        ${state.session ? `
          <div class="q-hint" style="margin:0 0 12px;">Signed in as <b style="color:var(--text);">${escapeHtml(state.session.user.email || '')}</b>. Entries sync automatically across any device you sign into.</div>
          <div class="q-hint" style="margin:0 0 14px;">Sync status: ${state.syncStatus === 'syncing' ? 'syncing…' : state.syncStatus === 'error' ? 'couldn\'t reach the cloud, changes are still saved locally' : 'up to date'}</div>
          <button class="btn btn-ghost" id="sign-out-btn">Sign out</button>
        ` : `
          <div class="q-hint" style="margin-bottom:14px;">Sign in to keep your entries backed up and available on any device. This is optional, everything still works locally without it.</div>
          <div class="q-block">
            <label class="q-label">Supabase project URL</label>
            <input type="text" id="settings-supabase-url" placeholder="https://xxxx.supabase.co" value="${escapeHtml(state.supabaseUrl || '')}">
          </div>
          <div class="q-block">
            <label class="q-label">Supabase anon/public key</label>
            <input type="password" id="settings-supabase-key" placeholder="eyJ…" value="${escapeHtml(state.supabaseAnonKey || '')}">
          </div>
          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <button class="btn btn-ghost" id="save-supabase-btn">Save cloud settings</button>
            <button class="btn" id="google-signin-btn">Sign in with Google</button>
            ${state.cloudSaved ? `<span class="save-confirm">saved ✓</span>` : ''}
          </div>
          <div class="q-hint" style="margin-top:10px; margin-bottom:0;">Your AI provider key never syncs to the cloud, it stays local to this browser only, you'll reconnect it on each new device.</div>
        `}
        ${state.errorMsg ? `<div class="error-box">${escapeHtml(state.errorMsg)}</div>` : ''}
      </div>

      <div class="today-title serif" style="margin-bottom:6px; font-size:19px;">AI connection</div>
      <div class="profile-card">
        ${providerSettingsFieldsHTML('settings')}
        <button class="btn" id="settings-save">Save connection</button>
        ${state.settingsSaved ? `<span class="save-confirm">saved ✓</span>` : ''}
        ${!state.aiProvider || !state.apiKeys[state.aiProvider] ? `<div class="q-hint" style="margin-top:10px; margin-bottom:0;">No provider connected yet, ratings and the Coach chat won't work until you add a key and save.</div>` : ''}
      </div>

      ${state.aiProfile ? `
        <div class="ai-profile-card">
          <div class="ai-profile-label">AI-derived insights, from Coach chats</div>
          <div class="ai-profile-text">${escapeHtml(state.aiProfile.summary)}</div>
          <div class="ai-profile-date">updated ${new Date(state.aiProfile.ts).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})} · used as extra context for future day ratings</div>
        </div>
        ${aiHistory.length > 0 ? `
          <div class="history-title">Past AI-profile versions (${aiHistory.length})</div>
          ${aiHistory.map(h => `
            <details class="history-item">
              <summary><span>${new Date(h.ts).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}</span><span>view →</span></summary>
              <div class="history-body">${escapeHtml(h.summary)}</div>
            </details>
          `).join('')}
        ` : ''}
      ` : `<div class="q-hint" style="margin-bottom:22px;">No AI-derived profile yet, chat with your Coach and hit "Update my profile" to build one.</div>`}

      <div class="today-title serif" style="margin-bottom:6px;">Your answers</div>
      <div class="q-hint" style="margin-bottom:20px;">Edit anytime. Future days will be rated against whatever's saved here. Every save keeps the old version below so you can see how your goals and values have shifted.</div>

      <div class="profile-card">
        <div class="q-block">
          <label class="q-label">What are you working toward right now?</label>
          <textarea id="p-goals" rows="2">${escapeHtml(p.goals)}</textarea>
        </div>
        <div class="q-block">
          <label class="q-label">What matters to you day-to-day?</label>
          <textarea id="p-values" rows="2">${escapeHtml(p.values)}</textarea>
        </div>
        <div class="q-block" style="margin-bottom:6px;">
          <label class="q-label">What drains you or should be a red flag?</label>
          <textarea id="p-redlines" rows="2">${escapeHtml(p.redlines)}</textarea>
        </div>
        <button class="btn" id="profile-save">Save changes</button>
        ${state.profileSaved ? `<span class="save-confirm">saved ✓</span>` : ''}
      </div>

      ${history.length > 0 ? `
        <div class="history-title">Past versions (${history.length})</div>
        ${history.map(h => `
          <details class="history-item">
            <summary><span>${new Date(h.ts).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}</span><span>view →</span></summary>
            <div class="history-body">
              <span class="history-label">Goals</span><div class="history-val">${escapeHtml(h.goals) || '-'}</div>
              <span class="history-label">Values</span><div class="history-val">${escapeHtml(h.values) || '-'}</div>
              <span class="history-label">Redlines</span><div class="history-val">${escapeHtml(h.redlines) || '-'}</div>
            </div>
          </details>
        `).join('')}
      ` : `<div class="empty-state">No past versions yet. Edit and save to start a history.</div>`}
    `;
  }

  /* ---------------- INIT ---------------- */
  (async function init(){
    await loadData();
    state.view = state.profile ? 'today' : 'onboarding';
    render();

    const client = getSupabaseClient();
    if (client) {
      try {
        const { data: { session } } = await client.auth.getSession();
        if (session) { state.session = session; await syncFromCloud(); render(); }
      } catch(e) { console.error('session check failed', e); }
      client.auth.onAuthStateChange(async (event, session) => {
        state.session = session;
        if (session) { await syncFromCloud(); }
        render();
      });
    }
  })();
})();
</script>
</body>
</html>
